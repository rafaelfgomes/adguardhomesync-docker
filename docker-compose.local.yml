services:
  adguardhome-sync:
    image: lscr.io/linuxserver/adguardhome-sync
    container_name: adguardhome-sync
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TIMEZONE:-Etc/UTC}
      - CONFIGFILE=/config/adguardhome-sync.yaml
      - ORIGIN_URL=${ADGUARDHOME_ORIGIN_URL}
      - ORIGIN_WEB_URL=${ADGUARDHOME_ORIGIN_WEB_URL}
      - ORIGIN_USERNAME=${ADGUARDHOME_USERNAME}
      - ORIGIN_PASSWORD=${ADGUARDHOME_PASSWORD}
      - REPLICA1_URL=${ADGUARDHOME_REPLICA_URL}
      - REPLICA1_WEB_URL=${ADGUARDHOME_REPLICA_WEB_URL}
      - REPLICA1_USERNAME=${ADGUARDHOME_USERNAME}
      - REPLICA1_PASSWORD=${ADGUARDHOME_PASSWORD}
    volumes:
      - ${ADGUARDHOMESYNC_CONFIG_FOLDER:-./config}:/config
    ports:
      - ${ADGUARDHOMESYNC_PORT:-8080}:8080
    restart: unless-stopped
    networks:
      local:
        ipv4_address: 172.${SUBNET_NUMBER:-20}.0.2

networks:
  local:
    name: adguardhome_sync-local-network
    ipam:
      config:
        - subnet: 172.${SUBNET_NUMBER:-20}.0.0/16