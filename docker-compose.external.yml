services:
  adguardhome-sync:
    image: lscr.io/linuxserver/adguardhome-sync
    container_name: adguardhome-sync
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TIMEZONE:-Etc/UTC}
      - CONFIGFILE=/config/adguardhome-sync.yaml
      - ORIGIN_URL=${ORIGIN_URL}
      - ORIGIN_USERNAME=${ORIGIN_USERNAME}
      - ORIGIN_PASSWORD=${ORIGIN_PASSWORD}
      - REPLICA1_URL=${REPLICA1_URL}
      - REPLICA1_USERNAME=${REPLICA1_USERNAME}
      - REPLICA1_PASSWORD=${REPLICA1_PASSWORD}
    volumes:
      - ${ADGUARDHOMESYNC_CONFIG_FOLDER:-./config}:/config
    restart: unless-stopped
    networks:
      external:
        ipv4_address: ${ADGUARDHOMESYNC_IP}

networks:
  external:
    external: true
    name: ${EXTERNAL_NETWORK_NAME}